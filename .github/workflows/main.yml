name: Knight School CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Build and Test .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore server/identity-api/Capstone.Identity.API/Capstone.Identity.API.csproj

      - name: Build backend
        working-directory: server/identity-api/Capstone.Identity.API
        run: dotnet build --configuration Release

      - name: Run backend tests
        working-directory: server/identity-api/Capstone.Identity.API
        run: dotnet test --solution Capstone.Identity.API.slnx --no-build -c Release

  # ---------------------------------------------------------------------------
  # Build the Docker images and push them to GitHub Container Registry (GHCR).
  # Runs only on a push to development, and only if BOTH jobs above passed.
  # PRs into main never publish images.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    permissions:
      contents: read
      packages: write   # allows GITHUB_TOKEN to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR image names must be all lowercase; the GitHub username may not be.
      - name: Set lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knightschool" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: server/identity-api/Capstone.Identity.API
          file: server/identity-api/Capstone.Identity.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:dev
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile.prod
          push: true
          # Empty on purpose: the frontend calls relative /api/... URLs,
          # so this one image works on every server.
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:dev
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Safety net: fail if any server address got baked into the frontend.
      - name: Check web image has no hard-coded API address
        run: |
          if docker run --rm --entrypoint sh "$IMAGE_PREFIX-web:${{ github.sha }}" \
               -c "grep -rqE 'localhost:8080|duckdns\.org' /srv"; then
            echo "::error::The web image contains a hard-coded API address. VITE_API_URL must be empty for server builds."
            exit 1
          fi
          echo "Web image is domain-free."